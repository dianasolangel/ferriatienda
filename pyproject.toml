[tool.poetry]
name = "ferriatienda"
version = "0.1.0"
description = "Chatbot and Ai agent for Ferritienda"
authors = ["dianasolangel <dianasolangelfh@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"  
numpy = "^2.2.3"
selenium = "^4.12.0"
pytesseract = "^0.3.10"
pdf2image = "^1.16.3"
Pillow = "^9.3.0"
requests = "^2.31.0"
pandas = "^2.1.1"
matplotlib = "^3.7.2"
ipykernel = "^6.29.5"
streamlit = "^1.42.2"
scikit-learn = "^1.6.1"
beautifulsoup4 = "^4.13.3"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
flake8 = "^6.1.0"
black = "^23.9.1"
mypy = "^1.5.1"
isort = "^5.12.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.1.2"
pytest = "^8.3.4"
pre-commit = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"