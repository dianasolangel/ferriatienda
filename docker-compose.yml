services:
  ferriatienda_app:
    build:
      context: .
    env_file:
      - .env
    container_name: ferriatienda_app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - /app/.venv  # Ignore le .venv local, garde celui du conteneur 
      - ~/.cache/huggingface:/root/.cache/huggingface  # 👈 Mount Hugging Face cache
    depends_on:
      - chroma
    environment:
      - PYTHONPATH=/app
    # restart: unless-stopped
    command: poetry run streamlit run ferriatienda/streamlit_app.py

  chroma:
    container_name: chroma_ferriatienda
    image: chromadb/chroma:1.0.12
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/data  
    restart: always
